name = "token-monitor-hub"
main = "src/index.js"
compatibility_date = "2025-05-01"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.05

[observability.logs]
enabled = true
head_sampling_rate = 0.05
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

[vars]
STALE_AFTER_MS = "600000"

# Set the shared secret with:
#   wrangler secret put TOKEN_MONITOR_SECRET
# Leave it unset only for trusted/private deployments.
